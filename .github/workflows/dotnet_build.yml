name: .NET CI/CD with Coverage

on:
  push:
    branches: [ main, dev, 'feature/**' ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - '**.yml'
      - '**.lua'
      - '**.toc'
      - '**.json'
      - '**.bmp'
      - '**.js'
      - '**.jpg'
      - '**.png'
      - 'docs/**'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - '**.yml'
      - '**.lua'
      - '**.toc'
      - '**.json'
      - '**.bmp'
      - '**.js'
      - '**.jpg'
      - '**.png'
      - 'docs/**'
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  # Coverage thresholds
  MIN_LINE_COVERAGE: 10  # Will increase to 80% as we improve coverage
  MIN_BRANCH_COVERAGE: 5  # Will increase to 70% as we improve coverage

jobs:
  # Job 1: Smoke Tests (Fast Feedback)
  smoke-tests:
    name: Smoke Tests
    runs-on: windows-latest
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Quick Test Run
      run: dotnet test --no-build --verbosity minimal --filter "FullyQualifiedName!~EndToEnd"

  # Job 2: Full Test Suite with Coverage
  full-tests:
    name: Full Test Suite
    runs-on: windows-latest
    needs: smoke-tests
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run Tests with Coverage
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults/
    
    - name: Generate Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
      with:
        reports: './TestResults/**/coverage.cobertura.xml'
        targetdir: './CoverageReport'
        reporttypes: 'Html;Markdown;JsonSummary'
        verbosity: 'Info'
    
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: ./CoverageReport/
    
    - name: Check Coverage Thresholds
      shell: pwsh
      run: |
        $coverageFile = './CoverageReport/Summary.json'
        if (Test-Path $coverageFile) {
          $coverage = Get-Content $coverageFile | ConvertFrom-Json
          $lineCoverage = $coverage.summary.lineCoverage
          $branchCoverage = $coverage.summary.branchCoverage
          
          Write-Host "Line Coverage: $lineCoverage%" -ForegroundColor Green
          Write-Host "Branch Coverage: $branchCoverage%" -ForegroundColor Green
          
          # Check line coverage threshold
          if ($lineCoverage -lt $env:MIN_LINE_COVERAGE) {
            Write-Host "ERROR: Line coverage ($lineCoverage%) is below threshold ($env:MIN_LINE_COVERAGE%)" -ForegroundColor Red
            exit 1
          }
          
          # Check branch coverage threshold
          if ($branchCoverage -lt $env:MIN_BRANCH_COVERAGE) {
            Write-Host "ERROR: Branch coverage ($branchCoverage%) is below threshold ($env:MIN_BRANCH_COVERAGE%)" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "Coverage thresholds passed!" -ForegroundColor Green
        } else {
          Write-Host "WARNING: Could not find coverage summary file" -ForegroundColor Yellow
        }
    
    - name: Comment PR with Coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const markdownPath = './CoverageReport/Summary.md';
          
          if (fs.existsSync(markdownPath)) {
            const coverageReport = fs.readFileSync(markdownPath, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Test Coverage Report\n\n${coverageReport}\n\n---\n*Generated by GitHub Actions*`
            });
          }

  # Job 3: Performance Benchmarks
  benchmarks:
    name: Performance Benchmarks
    runs-on: windows-latest
    needs: smoke-tests
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Release
      run: dotnet build --no-restore --configuration Release
    
    - name: Run Benchmarks
      run: dotnet run --project Benchmarks --configuration Release -- --exporters json --artifacts ./BenchmarkResults
      continue-on-error: true  # Don't fail on benchmark issues
    
    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: ./BenchmarkResults/
    
    - name: Check Performance Regression
      shell: pwsh
      run: |
        # This would compare against baseline benchmarks
        # For now, just check if benchmarks ran successfully
        Write-Host "Performance benchmarks completed"

  # Job 4: Code Quality
  code-quality:
    name: Code Quality Checks
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build with warnings as errors
      run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=true
      continue-on-error: true  # Allow warnings for now
    
    - name: Run dotnet format check
      run: dotnet format --verify-no-changes --verbosity detailed
      continue-on-error: true  # Don't fail on formatting issues

  # Job 5: Package Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Run security audit
      run: dotnet list package --vulnerable --include-transitive
      continue-on-error: true
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
      continue-on-error: true
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      continue-on-error: true
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      continue-on-error: true

  # Job 6: Summary Report
  summary:
    name: Summary Report
    runs-on: windows-latest
    needs: [smoke-tests, full-tests, benchmarks, code-quality]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    
    - name: Create Summary Report
      shell: pwsh
      run: |
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "  CI/CD Pipeline Summary" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host ""
        
        # Check test results
        $testResults = Get-ChildItem ./artifacts/test-results -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if ($testResults) {
          Write-Host "✅ Test Results Available" -ForegroundColor Green
          $testResults | ForEach-Object { Write-Host "  - $($_.Name)" }
        } else {
          Write-Host "❌ No Test Results Found" -ForegroundColor Red
        }
        
        Write-Host ""
        
        # Check coverage report
        $coverageReport = "./artifacts/coverage-report/index.html"
        if (Test-Path $coverageReport) {
          Write-Host "✅ Coverage Report Available" -ForegroundColor Green
        } else {
          Write-Host "❌ No Coverage Report Found" -ForegroundColor Red
        }
        
        Write-Host ""
        
        # Check benchmark results
        $benchmarkResults = Get-ChildItem ./artifacts/benchmark-results -Filter "*.json" -Recurse -ErrorAction SilentlyContinue
        if ($benchmarkResults) {
          Write-Host "✅ Benchmark Results Available" -ForegroundColor Green
        } else {
          Write-Host "⚠️  No Benchmark Results (optional)" -ForegroundColor Yellow
        }
        
        Write-Host ""
        Write-Host "========================================" -ForegroundColor Cyan
    
    - name: Upload Summary
      uses: actions/upload-artifact@v4
      with:
        name: ci-summary
        path: ./artifacts/
